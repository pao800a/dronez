[project]
name = "dronez"
version = "0.0.1"
description = "Parametric build123d quadcopter -> MuJoCo sim -> RL attitude/hover policy -> ONNX"
readme = "README.md"
license = "MIT"
authors = [{ name = "pao800a" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "mujoco>=3.3",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "torch>=2.5",
    "tensorboard>=2.17",
    "build123d>=0.9",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "matplotlib>=3.9",
    "imageio[ffmpeg]>=2.35",
    "mcp>=1.2",
]

[project.optional-dependencies]
wandb = ["wandb>=0.18"]

[project.scripts]
dronez-build-model = "dronez.cli:build_model"
dronez-train = "dronez.cli:train"
dronez-eval = "dronez.cli:evaluate"
dronez-export = "dronez.cli:export"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dronez"]

# CPU-only torch everywhere: no CUDA wheels (see docs/adr/0001).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools", "scripts", ".claude/hooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF", "PL", "PT"]
ignore = [
    "PLR0913", # physics functions legitimately take many parameters
    "PLR2004", # magic numbers are fine in tests and physics constants
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "RUF001",  # unicode symbols (°, ω, τ) in docstrings/strings are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]
".claude/hooks/**" = ["E402"]  # hooks add their own dir to sys.path before importing _hooklib

[tool.mypy]
python_version = "3.12"
files = ["src/dronez"]
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

# Strict where the physics lives (BUILD_PROMPT §8 CI gate).
[[tool.mypy.overrides]]
module = ["dronez.utils.*", "dronez.sim.*"]
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "fast: quick unit tests (< 60 s total), run by the Stop hook",
    "physics: physics sanity suite (needs the built model)",
    "cad: CAD/mass-property tests (builds solids with build123d)",
    "integration: env/training/export integration tests",
    "slow: anything taking more than a few seconds",
    "render: needs an OpenGL backend (EGL/OSMesa/WGL)",
]
